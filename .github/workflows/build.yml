name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build JS
        run: |
          npm install
          npm run build

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build native.dll
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build

      - name: Pack plugin
        shell: pwsh
        run: |
          Copy-Item cpp/build/native.dll native.dll -Force
          Compress-Archive -Path manifest.json, native.dll, preview.jpg, dist/main.js -DestinationPath taskbar_lyrics.plugin -Force

      # 组装商店抓取目录 dist/：manifest 的 injects 路径相对化，附带 CI 编译的 native.dll
      - name: Assemble dist
        shell: pwsh
        run: |
          Copy-Item cpp/build/native.dll dist/native.dll -Force
          Copy-Item preview.jpg dist/preview.jpg -Force
          $manifest = Get-Content manifest.json -Raw -Encoding UTF8 | ConvertFrom-Json
          $manifest.injects.Main[0].file = "./main.js"
          $manifest | ConvertTo-Json -Depth 10 | Out-File dist/manifest.json -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskbar_lyrics.plugin
          path: taskbar_lyrics.plugin

      # 发布 tag 时把构建产物（含 native.dll）提交回仓库 dist/，供插件商店机器人抓取
      - name: Commit dist to repo
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "build: update dist artifacts $env:GITHUB_REF_NAME" }
          git push origin HEAD:main

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: taskbar_lyrics.plugin
