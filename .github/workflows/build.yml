name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build JS
        run: |
          npm install
          npm run build

      - name: Build native.dll
        run: |
          cmake -S cpp -B cpp/build -G "Visual Studio 17 2022" -A x64
          cmake --build cpp/build --config Release

      - name: Pack plugin
        shell: pwsh
        run: |
          Copy-Item cpp/build/Release/native.dll native.dll -Force
          Compress-Archive -Path manifest.json, native.dll, preview.png, dist/main.js -DestinationPath taskbar_lyrics.plugin -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: taskbar_lyrics.plugin
          path: taskbar_lyrics.plugin

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: taskbar_lyrics.plugin
